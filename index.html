  <!-- Non-blocking Zero-TBT Third-Party Monetization & Telemetry -->
  <script>
    (function() {
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CKPQGSX23W', { 'send_page_view': true });

      var executed = false;
      function injectThirdParty() {
        if (executed) return;
        executed = true;

        // 1. Google Analytics
        var ga = document.createElement('script');
        ga.async = true;
        ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-CKPQGSX23W';
        document.body.appendChild(ga);

        // 2. Google AdSense
        var ads = document.createElement('script');
        ads.async = true;
        ads.crossOrigin = 'anonymous';
        ads.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7155174810446636';
        document.body.appendChild(ads);
      }

      // Execute on first user interaction or idle window
      ['scroll', 'touchstart', 'mousemove', 'keydown', 'click'].forEach(function(evt) {
        window.addEventListener(evt, injectThirdParty, { once: true, passive: true });
      });

      // Safe fallback after initial rendering completes
      if ('requestIdleCallback' in window) {
        requestIdleCallback(injectThirdParty, { timeout: 4000 });
      } else {
        setTimeout(injectThirdParty, 4000);
      }
    })();
  </script>
